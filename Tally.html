<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Raghuvir Sweets and Bakers | Tally Billing Update</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-primary:#7a1f2b;
    --brand-secondary:#d4a437;
    --bg:#f6f3ee;
  }
  * { font-family:'Poppins', sans-serif; }
  body { background:var(--bg); padding-bottom:60px; }
  .brand-header{
    background: linear-gradient(135deg, var(--brand-primary), #4d1017);
    color:#fff; padding:18px 16px; box-shadow:0 4px 14px rgba(0,0,0,.15);
  }
  .brand-header img{ height:52px; width:52px; object-fit:cover; border-radius:50%; border:2px solid var(--brand-secondary); background:#fff; }
  .brand-title{ font-weight:700; font-size:1.15rem; line-height:1.1; }
  .brand-sub{ font-size:.75rem; opacity:.85; letter-spacing:.5px; }
  .card{ border:none; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,.07); }
  .form-label{ font-weight:600; font-size:.88rem; color:#3a2b1a; }
  .form-control, .form-select{ border-radius:10px; padding:10px 12px; }
  .form-control:focus, .form-select:focus{ border-color:var(--brand-secondary); box-shadow:0 0 0 .2rem rgba(212,164,55,.25); }
  .btn-success{ background:var(--brand-primary); border:none; border-radius:12px; padding:12px; font-weight:600; }
  .btn-success:hover{ background:#5e1620; }
  .btn-outline-secondary{ border-radius:10px; }
  .readonly-box{ background:#fbf7ee; border:1px dashed var(--brand-secondary); border-radius:12px; padding:14px; font-size:.9rem; }
  .readonly-box div{ margin-bottom:4px; }
  .toast-container{ z-index:1080; }
  .verify-note{ font-size:.75rem; color:#8a6d00; background:#fff6da; border-radius:8px; padding:6px 10px; margin-top:6px; }
</style>
</head>
<body>

<div class="brand-header d-flex align-items-center gap-3">
  <img src="https://drive.google.com/thumbnail?id=18aiuiSN9uj-mJtOkGB1rNt4GP6yUbvuO&sz=w200" alt="Logo" referrerpolicy="no-referrer" onerror="this.style.display='none'">
  <div class="flex-grow-1">
    <div class="brand-title">Raghuvir Sweets and Bakers</div>
    <div class="brand-sub">TALLY BILLING UPDATE — ACCOUNTANT DASHBOARD</div>
  </div>
</div>

<div class="container mt-3" style="max-width:640px;">
  <div class="card p-3 mb-3">
    <label class="form-label">Vendor</label>
    <select id="vendorFilter" class="form-select mb-3">
      <option value="">Loading vendors...</option>
    </select>

    <label class="form-label">Pending Bills</label>
    <div class="input-group mb-2">
      <select id="pendingBills" class="form-select">
        <option value="">Select a vendor first</option>
      </select>
      <button id="refreshBtn" class="btn btn-outline-secondary">↻</button>
    </div>
  </div>

  <div class="card p-3 mb-3" id="detailsCard" style="display:none;">
    <h6 class="mb-2">Bill Details</h6>
    <div class="readonly-box" id="detailsBox"></div>
  </div>

  <div class="card p-3" id="formCard" style="display:none;">
    <form id="tallyForm">
      <div class="mb-3">
        <label class="form-label">Accountant Name / ID</label>
        <input type="text" id="accountantName" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Invoice / Bill Reference No.</label>
        <input type="text" id="invoiceRef" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Bill Amount (₹)</label>
        <input type="number" id="billAmount" min="0" step="0.01" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Payment Mode</label>
        <select id="paymentMode" class="form-select" required>
          <option value="">Select...</option>
          <option value="Cash">Cash</option>
          <option value="UPI">UPI</option>
          <option value="Cheque">Cheque</option>
          <option value="Credit">Credit</option>
        </select>
        <div class="verify-note">Pre-filled from the inward entry — please verify and correct if needed before submitting.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Remark</label>
        <textarea id="remark" class="form-control" rows="3"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Upload Final Tally-Entered Invoice</label>
        <input type="file" id="tallyPhoto" class="form-control" accept="image/*,application/pdf">
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="updatedInTally" required>
        <label class="form-check-label" for="updatedInTally">Updated in Tally</label>
      </div>

      <button type="submit" class="btn btn-success w-100 text-white" id="submitBtn">Verify &amp; Submit Entry</button>
    </form>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toast" class="toast align-items-center text-white border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastBody"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ============ CONFIG ============ */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgBHm9_j0srdnmgXNwQgvDnB7ymtdyOfjE399vm1uyJG2Uh8yP5XdeD5zH_M691rEC-w/exec";

function showToast(message, type = 'success') {
  const toastEl = document.getElementById('toast');
  toastEl.className = 'toast align-items-center text-white border-0 bg-' + (type === 'success' ? 'success' : 'danger');
  document.getElementById('toastBody').textContent = message;
  new bootstrap.Toast(toastEl).show();
}

const vendorFilter = document.getElementById('vendorFilter');
const pendingSelect = document.getElementById('pendingBills');
const detailsCard = document.getElementById('detailsCard');
const detailsBox = document.getElementById('detailsBox');
const formCard = document.getElementById('formCard');
const paymentModeSelect = document.getElementById('paymentMode');

function loadVendors() {
  fetch(APPS_SCRIPT_URL + '?action=getVendorsWithPendingBills')
    .then(r => r.json())
    .then(res => {
      if (!res.ok) {
        vendorFilter.innerHTML = '<option value="">Failed to load vendors</option>';
        return showToast(res.error || 'Failed to load vendors', 'error');
      }
      const previouslySelected = vendorFilter.value;
      if (res.vendors.length === 0) {
        vendorFilter.innerHTML = '<option value="">No vendors with pending Tally bills 🎉</option>';
        return;
      }
      vendorFilter.innerHTML = '<option value="">-- Select vendor --</option>';
      res.vendors.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        vendorFilter.appendChild(opt);
      });
      // keep the accountant's current selection if it's still in the pending list
      if (previouslySelected && res.vendors.includes(previouslySelected)) {
        vendorFilter.value = previouslySelected;
      }
    })
    .catch(err => {
      vendorFilter.innerHTML = '<option value="">Failed to load vendors</option>';
      showToast('Network error: ' + err, 'error');
    });
}
loadVendors();

function loadPendingBills() {
  const vendor = vendorFilter.value;
  if (!vendor) {
    pendingSelect.innerHTML = '<option value="">Select a vendor first</option>';
    detailsCard.style.display = 'none';
    formCard.style.display = 'none';
    return;
  }
  pendingSelect.innerHTML = '<option value="">Loading...</option>';
  fetch(APPS_SCRIPT_URL + '?action=getPendingBills&vendor=' + encodeURIComponent(vendor))
    .then(r => r.json())
    .then(res => {
      if (!res.ok) return showToast(res.error || 'Failed to load bills', 'error');
      pendingSelect.innerHTML = '<option value="">-- Select a pending bill --</option>';
      res.bills.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.rowUid;
        opt.textContent = b.label;
        pendingSelect.appendChild(opt);
      });
      if (res.bills.length === 0) {
        pendingSelect.innerHTML = '<option value="">No pending bills for this vendor 🎉</option>';
      }
    })
    .catch(err => showToast('Network error: ' + err, 'error'));
}

vendorFilter.addEventListener('change', loadPendingBills);
document.getElementById('refreshBtn').addEventListener('click', loadPendingBills);

pendingSelect.addEventListener('change', () => {
  const rowUid = pendingSelect.value;
  if (!rowUid) {
    detailsCard.style.display = 'none';
    formCard.style.display = 'none';
    return;
  }
  fetch(APPS_SCRIPT_URL + '?action=getBillDetails&rowUid=' + encodeURIComponent(rowUid))
    .then(r => r.json())
    .then(res => {
      if (!res.ok) return showToast(res.error || 'Failed to load details', 'error');
      const d = res.details;
      detailsBox.innerHTML = `
        <div><strong>Branch:</strong> ${d.branch}</div>
        <div><strong>Vendor:</strong> ${d.vendorName}</div>
        <div><strong>Item Name:</strong> ${d.itemName}</div>
        <div><strong>Quantity:</strong> ${d.quantity}</div>
        <div><strong>Payment Status:</strong> ${d.paymentStatus}</div>
        <div><strong>Payment Mode (as entered):</strong> ${d.paymentMode}</div>
        <div><strong>Original Bill:</strong> ${d.billFileLink ? `<a href="${d.billFileLink}" target="_blank">View File</a>` : '—'}</div>
      `;
      // Pre-fill payment mode for verification — accountant can change it
      paymentModeSelect.value = d.paymentMode || '';
      detailsCard.style.display = 'block';
      formCard.style.display = 'block';
    })
    .catch(err => showToast('Network error: ' + err, 'error'));
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve('');
    if (!file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
      return;
    }
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      const MAX_DIM = 1600;
      let { width, height } = img;
      if (width > MAX_DIM || height > MAX_DIM) {
        const scale = MAX_DIM / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('tallyForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const rowUid = pendingSelect.value;
  if (!rowUid) return showToast('Select a pending bill first', 'error');
  if (!document.getElementById('updatedInTally').checked) {
    return showToast('You must check "Updated in Tally" to submit', 'error');
  }
  const billAmount = document.getElementById('billAmount').value;
  if (!billAmount || Number(billAmount) <= 0) return showToast('Enter a valid Bill Amount', 'error');
  const paymentMode = paymentModeSelect.value;
  if (!paymentMode) return showToast('Please verify/select the Payment Mode', 'error');

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Compressing photo...';

  try {
    const fileInput = document.getElementById('tallyPhoto');
    const tallyPhotoData = await fileToBase64(fileInput.files[0]);
    submitBtn.textContent = 'Submitting...';

    const payload = {
      action: 'submitTallyUpdate',
      rowUid: rowUid,
      vendorName: vendorFilter.value,
      accountantName: document.getElementById('accountantName').value.trim(),
      invoiceRef: document.getElementById('invoiceRef').value.trim(),
      billAmount: billAmount,
      paymentMode: paymentMode,
      remark: document.getElementById('remark').value.trim(),
      updatedInTally: document.getElementById('updatedInTally').checked,
      tallyPhotoData: tallyPhotoData
    };

    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (data.ok) {
      showToast('Tally update saved!');
      document.getElementById('tallyForm').reset();
      detailsCard.style.display = 'none';
      formCard.style.display = 'none';
      loadVendors();
      loadPendingBills();
    } else {
      showToast(data.error || 'Submit failed', 'error');
    }
  } catch (err) {
    showToast('Error: ' + err.message, 'error');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Verify & Submit Entry';
  }
});
</script>
</body>
</html>
