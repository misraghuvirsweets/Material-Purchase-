<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Raghuvir Sweets and Bakers | Party Payment Dues</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-primary:#7a1f2b;
    --brand-secondary:#d4a437;
    --bg:#f6f3ee;
  }
  * { font-family:'Poppins', sans-serif; }
  body { background:var(--bg); padding-bottom:60px; }
  .brand-header{
    background: linear-gradient(135deg, var(--brand-primary), #4d1017);
    color:#fff; padding:18px 16px; box-shadow:0 4px 14px rgba(0,0,0,.15);
  }
  .brand-header img{ height:52px; width:52px; object-fit:cover; border-radius:50%; border:2px solid var(--brand-secondary); background:#fff; }
  .brand-title{ font-weight:700; font-size:1.15rem; line-height:1.1; }
  .brand-sub{ font-size:.75rem; opacity:.85; letter-spacing:.5px; }
  .card{ border:none; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,.07); }
  .form-label{ font-weight:600; font-size:.88rem; color:#3a2b1a; }
  .form-control, .form-select{ border-radius:10px; padding:10px 12px; }
  .form-control:focus, .form-select:focus{ border-color:var(--brand-secondary); box-shadow:0 0 0 .2rem rgba(212,164,55,.25); }
  .btn-success{ background:var(--brand-primary); border:none; border-radius:12px; padding:12px; font-weight:600; }
  .btn-success:hover{ background:#5e1620; }
  .nav-pills .nav-link{ border-radius:10px; font-weight:600; color:var(--brand-primary); }
  .nav-pills .nav-link.active{ background:var(--brand-primary); }
  .table-sm td, .table-sm th{ font-size:.82rem; vertical-align:middle; }
  .due-critical{ color:#b02a37; font-weight:700; }
  .due-warn{ color:#b8842b; font-weight:600; }
  .due-ok{ color:#2f6e3f; font-weight:600; }
  .btn-paid{ background:#2f6e3f; border:none; color:#fff; border-radius:8px; font-size:.78rem; padding:4px 10px; }
  .btn-paid:hover{ background:#234f2e; color:#fff; }
  .summary-card{ background:#fff; border-radius:14px; padding:14px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .summary-card .val{ font-size:1.2rem; font-weight:700; color:var(--brand-primary); }
  .summary-card .lbl{ font-size:.72rem; color:#8a7a63; text-transform:uppercase; letter-spacing:.4px; }
  .toast-container{ z-index:1080; }
  a.bill-link{ font-size:.78rem; }
</style>
</head>
<body>

<div class="brand-header d-flex align-items-center gap-3">
  <img src="https://drive.google.com/thumbnail?id=18aiuiSN9uj-mJtOkGB1rNt4GP6yUbvuO&sz=w200" alt="Logo" referrerpolicy="no-referrer" onerror="this.style.display='none'">
  <div class="flex-grow-1">
    <div class="brand-title">Raghuvir Sweets and Bakers</div>
    <div class="brand-sub">PARTY PAYMENT DUES — ADMIN DASHBOARD</div>
  </div>
</div>

<div class="container mt-3" style="max-width:760px;">

  <ul class="nav nav-pills mb-3" id="tabNav">
    <li class="nav-item"><button class="nav-link active" data-tab="dueTab">Due Bills</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="paidTab">Paid Bills</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="summaryTab">Party Summary</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="addTab">+ Add Due Bill</button></li>
  </ul>

  <!-- DUE BILLS -->
  <div class="tab-pane" id="dueTab">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="mb-0">Pending Dues</h6>
        <button class="btn btn-sm btn-outline-secondary" id="refreshDueBtn">↻ Refresh</button>
      </div>
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead><tr><th>Party</th><th>Bill Date</th><th>Amount</th><th>Mode</th><th>Due Days</th><th>Bill</th><th></th></tr></thead>
          <tbody id="dueBody"><tr><td colspan="7" class="text-center text-muted py-3">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- PAID BILLS -->
  <div class="tab-pane" id="paidTab" style="display:none;">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="mb-0">Paid Bills</h6>
        <button class="btn btn-sm btn-outline-secondary" id="refreshPaidBtn">↻ Refresh</button>
      </div>
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead><tr><th>Party</th><th>Bill Date</th><th>Amount</th><th>Mode</th><th>Bill</th></tr></thead>
          <tbody id="paidBody"><tr><td colspan="5" class="text-center text-muted py-3">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- PARTY SUMMARY -->
  <div class="tab-pane" id="summaryTab" style="display:none;">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="mb-0">Party-wise Summary</h6>
        <button class="btn btn-sm btn-outline-secondary" id="refreshSummaryBtn">↻ Refresh</button>
      </div>
      <div id="summaryCards" class="row g-2 mb-3"></div>
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead><tr><th>Party</th><th>Total Due</th><th># Due</th><th>Total Paid</th><th># Paid</th><th>Grand Total</th></tr></thead>
          <tbody id="summaryBody"><tr><td colspan="6" class="text-center text-muted py-3">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ADD DUE BILL -->
  <div class="tab-pane" id="addTab" style="display:none;">
    <div class="card p-3">
      <h6 class="mb-3">Add a New Due Bill</h6>
      <form id="addDueForm">
        <div class="mb-3">
          <label class="form-label">Party (Vendor)</label>
          <select id="partyName" class="form-select" required>
            <option value="">Loading vendors...</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Bill Date</label>
          <input type="date" id="billDate" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Bill Amount</label>
          <input type="number" id="billAmount" min="0" step="0.01" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Payment Status</label>
          <select id="paymentStatus" class="form-select" required>
            <option value="Payment Pending" selected>Payment Pending</option>
            <option value="Payment Done">Payment Done</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Payment Mode</label>
          <select id="paymentMode" class="form-select" required>
            <option value="">Select...</option>
            <option value="Cash">Cash</option>
            <option value="UPI">UPI</option>
            <option value="Cheque">Cheque</option>
            <option value="Credit">Credit</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Bill Photo</label>
          <input type="file" id="billPhoto" class="form-control" accept="image/*,application/pdf">
        </div>
        <button type="submit" class="btn btn-success w-100 text-white" id="addDueBtn">Add Due Bill</button>
      </form>
    </div>
  </div>

</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toast" class="toast align-items-center text-white border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastBody"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgBHm9_j0srdnmgXNwQgvDnB7ymtdyOfjE399vm1uyJG2Uh8yP5XdeD5zH_M691rEC-w/exec";

function showToast(message, type = 'success') {
  const toastEl = document.getElementById('toast');
  toastEl.className = 'toast align-items-center text-white border-0 bg-' + (type === 'success' ? 'success' : 'danger');
  document.getElementById('toastBody').textContent = message;
  new bootstrap.Toast(toastEl).show();
}

/* ============ Tabs ============ */
document.querySelectorAll('#tabNav .nav-link').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#tabNav .nav-link').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
    document.getElementById(btn.dataset.tab).style.display = 'block';
    if (btn.dataset.tab === 'dueTab') loadDue();
    if (btn.dataset.tab === 'paidTab') loadPaid();
    if (btn.dataset.tab === 'summaryTab') loadSummary();
  });
});

/* ============ Due bill row coloring by age ============ */
function dueDaysClass(days) {
  if (days === '' || days === null || isNaN(days)) return '';
  if (days >= 30) return 'due-critical';
  if (days >= 15) return 'due-warn';
  return 'due-ok';
}

/* ============ Load Due Bills ============ */
function loadDue() {
  const body = document.getElementById('dueBody');
  body.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-3">Loading...</td></tr>';
  fetch(APPS_SCRIPT_URL + '?action=getDuePayments')
    .then(r => r.json())
    .then(res => {
      if (!res.ok) { body.innerHTML = '<tr><td colspan="7" class="text-danger text-center py-3">' + (res.error || 'Failed to load') + '</td></tr>'; return; }
      if (res.dues.length === 0) { body.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-3">No pending dues 🎉</td></tr>'; return; }
      body.innerHTML = res.dues.map(d => `
        <tr>
          <td>${d.partyName}</td>
          <td>${d.billDate}</td>
          <td>₹${Number(d.billAmount).toLocaleString('en-IN')}</td>
          <td>${d.paymentMode}</td>
          <td class="${dueDaysClass(d.dueDays)}">${d.dueDays}</td>
          <td>${d.billPhotoLink ? `<a class="bill-link" href="${d.billPhotoLink}" target="_blank">View</a>` : '—'}</td>
          <td><button class="btn-paid" onclick="markPaid('${d.recordId}','${d.partyName.replace(/'/g,"\\'")}')">Mark Paid</button></td>
        </tr>
      `).join('');
    })
    .catch(err => body.innerHTML = '<tr><td colspan="7" class="text-danger text-center py-3">Network error: ' + err + '</td></tr>');
}
document.getElementById('refreshDueBtn').addEventListener('click', loadDue);

function markPaid(recordId, partyName) {
  if (!confirm('Mark this bill from "' + partyName + '" as paid? It will move to Paid Payments.')) return;
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'markPaymentAsPaid', recordId: recordId })
  })
    .then(r => r.json())
    .then(res => {
      if (res.ok) { showToast(res.message || 'Marked as paid!'); loadDue(); }
      else showToast(res.error || 'Failed to update', 'error');
    })
    .catch(err => showToast('Network error: ' + err, 'error'));
}

/* ============ Load Paid Bills ============ */
function loadPaid() {
  const body = document.getElementById('paidBody');
  body.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">Loading...</td></tr>';
  fetch(APPS_SCRIPT_URL + '?action=getPaidPayments')
    .then(r => r.json())
    .then(res => {
      if (!res.ok) { body.innerHTML = '<tr><td colspan="5" class="text-danger text-center py-3">' + (res.error || 'Failed to load') + '</td></tr>'; return; }
      if (res.paid.length === 0) { body.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">No paid bills yet</td></tr>'; return; }
      body.innerHTML = res.paid.map(p => `
        <tr>
          <td>${p.partyName}</td>
          <td>${p.billDate}</td>
          <td>₹${Number(p.billAmount).toLocaleString('en-IN')}</td>
          <td>${p.paymentMode}</td>
          <td>${p.billPhotoLink ? `<a class="bill-link" href="${p.billPhotoLink}" target="_blank">View</a>` : '—'}</td>
        </tr>
      `).join('');
    })
    .catch(err => body.innerHTML = '<tr><td colspan="5" class="text-danger text-center py-3">Network error: ' + err + '</td></tr>');
}
document.getElementById('refreshPaidBtn').addEventListener('click', loadPaid);

/* ============ Party Summary ============ */
function loadSummary() {
  const body = document.getElementById('summaryBody');
  const cards = document.getElementById('summaryCards');
  body.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">Loading...</td></tr>';
  cards.innerHTML = '';
  fetch(APPS_SCRIPT_URL + '?action=getPartyPaymentSummary')
    .then(r => r.json())
    .then(res => {
      if (!res.ok) { body.innerHTML = '<tr><td colspan="6" class="text-danger text-center py-3">' + (res.error || 'Failed to load') + '</td></tr>'; return; }
      const totalDue = res.summary.reduce((s, p) => s + p.totalDue, 0);
      const totalPaid = res.summary.reduce((s, p) => s + p.totalPaid, 0);
      cards.innerHTML = `
        <div class="col-6"><div class="summary-card"><div class="val">₹${totalDue.toLocaleString('en-IN')}</div><div class="lbl">Total Outstanding</div></div></div>
        <div class="col-6"><div class="summary-card"><div class="val">₹${totalPaid.toLocaleString('en-IN')}</div><div class="lbl">Total Paid</div></div></div>
      `;
      if (res.summary.length === 0) { body.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">No data yet</td></tr>'; return; }
      body.innerHTML = res.summary.map(p => `
        <tr>
          <td>${p.partyName}</td>
          <td class="${p.totalDue > 0 ? 'due-critical' : ''}">₹${p.totalDue.toLocaleString('en-IN')}</td>
          <td>${p.dueCount}</td>
          <td>₹${p.totalPaid.toLocaleString('en-IN')}</td>
          <td>${p.paidCount}</td>
          <td>₹${p.grandTotal.toLocaleString('en-IN')}</td>
        </tr>
      `).join('');
    })
    .catch(err => body.innerHTML = '<tr><td colspan="6" class="text-danger text-center py-3">Network error: ' + err + '</td></tr>');
}
document.getElementById('refreshSummaryBtn').addEventListener('click', loadSummary);

/* ============ Add Due Bill form ============ */
function loadVendorsForAdd() {
  const sel = document.getElementById('partyName');
  fetch(APPS_SCRIPT_URL + '?action=getVendors')
    .then(r => r.json())
    .then(res => {
      if (!res.ok) { sel.innerHTML = '<option value="">Failed to load vendors</option>'; return; }
      sel.innerHTML = '<option value="">-- Select party --</option>';
      res.vendors.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v; opt.textContent = v;
        sel.appendChild(opt);
      });
    })
    .catch(() => { sel.innerHTML = '<option value="">Failed to load vendors</option>'; });
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve('');
    if (!file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
      return;
    }
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      const MAX_DIM = 1600;
      let { width, height } = img;
      if (width > MAX_DIM || height > MAX_DIM) {
        const scale = MAX_DIM / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('addDueForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('addDueBtn');
  btn.disabled = true;
  btn.textContent = 'Compressing photo...';
  try {
    const fileInput = document.getElementById('billPhoto');
    const billPhotoData = await fileToBase64(fileInput.files[0]);
    btn.textContent = 'Saving...';

    const payload = {
      action: 'addDuePayment',
      partyName: document.getElementById('partyName').value,
      billDate: document.getElementById('billDate').value,
      billAmount: document.getElementById('billAmount').value,
      paymentStatus: document.getElementById('paymentStatus').value,
      paymentMode: document.getElementById('paymentMode').value,
      billPhotoData: billPhotoData
    };
    if (!payload.partyName) { showToast('Select a party', 'error'); return; }

    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.ok) {
      showToast(data.message || 'Due bill added!');
      document.getElementById('addDueForm').reset();
    } else {
      showToast(data.error || 'Failed to add', 'error');
    }
  } catch (err) {
    showToast('Error: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Add Due Bill';
  }
});

/* ============ Init ============ */
loadVendorsForAdd();
loadDue();
</script>
</body>
</html>
