<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Raghuvir Sweets and Bakers | Material Inward</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --brand-primary:#7a1f2b;
    --brand-secondary:#d4a437;
    --bg:#f6f3ee;
  }
  * { font-family:'Poppins', sans-serif; }
  body { background:var(--bg); padding-bottom:60px; }
  .brand-header{
    background: linear-gradient(135deg, var(--brand-primary), #4d1017);
    color:#fff; padding:18px 16px; box-shadow:0 4px 14px rgba(0,0,0,.15);
  }
  .brand-header img{ height:52px; width:52px; object-fit:cover; border-radius:50%; border:2px solid var(--brand-secondary); background:#fff; }
  .brand-title{ font-weight:700; font-size:1.15rem; line-height:1.1; }
  .brand-sub{ font-size:.75rem; opacity:.85; letter-spacing:.5px; }
  .branch-badge{ font-size:.75rem; background:var(--brand-secondary)!important; color:#3a2900; }
  .card{ border:none; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,.07); }
  .form-label{ font-weight:600; font-size:.88rem; color:#3a2b1a; }
  .btn-scan{
    background: linear-gradient(135deg, var(--brand-secondary), #b8842b);
    border:none; color:#fff; font-weight:600; font-size:1.05rem; padding:16px;
    border-radius:14px; box-shadow:0 4px 12px rgba(212,164,55,.4);
  }
  .btn-scan:active{ transform: scale(.98); }
  .btn-success{ background:var(--brand-primary); border:none; border-radius:12px; padding:12px; font-weight:600; }
  .btn-success:hover{ background:#5e1620; }
  .form-control, .form-select{ border-radius:10px; padding:10px 12px; }
  .form-control:focus, .form-select:focus{ border-color:var(--brand-secondary); box-shadow:0 0 0 .2rem rgba(212,164,55,.25); }
  #reader{ width:100%; border-radius:12px; overflow:hidden; }
  .scan-modal .modal-content{ border-radius:16px; overflow:hidden; }
  .scan-modal .modal-header{ background:var(--brand-primary); color:#fff; border:none; }
  .scan-status{ font-size:.9rem; color:#6c757d; text-align:center; margin-top:8px; }
  .toast-container{ z-index:1080; }
  .item-preview{ background:#fbf7ee; border:1px dashed var(--brand-secondary); border-radius:12px; padding:12px; font-size:.85rem; }
  .source-badge{ font-size:.7rem; }
</style>
</head>
<body>

<div class="brand-header d-flex align-items-center gap-3">
  <img src="https://drive.google.com/uc?export=view&id=18aiuiSN9uj-mJtOkGB1rNt4GP6yUbvuO" alt="Logo" onerror="this.style.display='none'">
  <div class="flex-grow-1">
    <div class="brand-title">Raghuvir Sweets and Bakers</div>
    <div class="brand-sub">MATERIAL INWARD SYSTEM</div>
  </div>
  <span id="branchBadge" class="badge branch-badge">Branch: --</span>
</div>

<div class="container mt-3" style="max-width:600px;">

  <button type="button" class="btn btn-scan w-100 mb-3" id="openScanBtn">
    📷&nbsp; Scan Barcode
  </button>

  <div class="card p-3">
    <form id="inwardForm">
      <div class="mb-3">
        <label class="form-label">Barcode</label>
        <input type="text" id="barcode" class="form-control" placeholder="Tap 'Scan Barcode' above, or type manually" required>
      </div>

      <div id="itemPreview" class="item-preview mb-3" style="display:none;">
        <span class="badge source-badge" id="sourceBadge"></span>
        <div class="mt-1"><strong id="previewName"></strong></div>
        <div class="text-muted" id="previewMeta"></div>
      </div>

      <div class="mb-3">
        <label class="form-label">Vendor</label>
        <select id="vendorName" class="form-select" required>
          <option value="">Loading vendors...</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Item Name</label>
        <input type="text" id="itemName" class="form-control" required>
      </div>

      <div class="row">
        <div class="col-6 mb-3">
          <label class="form-label">Category</label>
          <input type="text" id="category" class="form-control">
        </div>
        <div class="col-6 mb-3">
          <label class="form-label">Unit</label>
          <input type="text" id="unit" class="form-control">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Quantity</label>
        <input type="number" id="quantity" min="0" step="any" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Bill Date</label>
        <input type="date" id="billDate" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Payment Status</label>
        <select id="paymentStatus" class="form-select" required>
          <option value="">Select...</option>
          <option value="Payment Done">Payment Done</option>
          <option value="Payment Pending">Payment Pending</option>
        </select>
      </div>

      <div class="mb-3" id="paymentModeWrap" style="display:none;">
        <label class="form-label">Payment Mode</label>
        <div id="paymentModeOptions" class="d-flex gap-3 flex-wrap"></div>
      </div>

      <div class="mb-3">
        <label class="form-label">Bill Photo / PDF</label>
        <input type="file" id="billFile" class="form-control" accept="image/*,application/pdf">
      </div>

      <button type="submit" class="btn btn-success w-100 text-white" id="submitBtn">Save Entry</button>
    </form>
  </div>
</div>

<!-- Scan Modal -->
<div class="modal fade scan-modal" id="scanModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title">📷 Point camera at the barcode</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" id="closeScanBtn"></button>
      </div>
      <div class="modal-body">
        <div id="reader"></div>
        <div class="scan-status" id="scanStatus">Initializing camera...</div>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toast" class="toast align-items-center text-white border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastBody"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ============ CONFIG ============ */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgBHm9_j0srdnmgXNwQgvDnB7ymtdyOfjE399vm1uyJG2Uh8yP5XdeD5zH_M691rEC-w/exec";

/* ============ Branch detection ============ */
const params = new URLSearchParams(window.location.search);
const branch = params.get('branch') || 'Branch1';
document.getElementById('branchBadge').textContent = 'Branch: ' + branch;

/* ============ Toast helper ============ */
function showToast(message, type = 'success') {
  const toastEl = document.getElementById('toast');
  toastEl.className = 'toast align-items-center text-white border-0 bg-' + (type === 'success' ? 'success' : 'danger');
  document.getElementById('toastBody').textContent = message;
  new bootstrap.Toast(toastEl).show();
}

/* ============ One-button Scan Barcode flow ============ */
const scanModalEl = document.getElementById('scanModal');
const scanModal = new bootstrap.Modal(scanModalEl);
const scanStatus = document.getElementById('scanStatus');
let html5QrCode;
let scannerRunning = false;

document.getElementById('openScanBtn').addEventListener('click', () => {
  scanStatus.textContent = 'Initializing camera...';
  scanModal.show();
});

scanModalEl.addEventListener('shown.bs.modal', () => {
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (decodedText) => {
      if (scannerRunning === false) return; // avoid double fires
      scannerRunning = false;
      scanStatus.textContent = 'Barcode captured: ' + decodedText;
      document.getElementById('barcode').value = decodedText;
      stopScanner(() => {
        scanModal.hide();
        lookupBarcode(decodedText);
      });
    },
    () => {}
  ).then(() => {
    scannerRunning = true;
    scanStatus.textContent = 'Scanning... hold steady';
  }).catch(err => {
    scanStatus.textContent = 'Camera error — check permissions.';
    showToast('Camera error: ' + err, 'error');
  });
});

scanModalEl.addEventListener('hidden.bs.modal', () => {
  if (scannerRunning) stopScanner();
});

function stopScanner(cb) {
  if (html5QrCode && scannerRunning) {
    html5QrCode.stop().then(() => {
      scannerRunning = false;
      if (cb) cb();
    }).catch(() => { if (cb) cb(); });
  } else if (cb) {
    cb();
  }
}

/* ============ Vendor dropdown ============ */
function loadVendors() {
  const vendorSelect = document.getElementById('vendorName');
  fetch(APPS_SCRIPT_URL + '?action=getVendors')
    .then(r => r.json())
    .then(res => {
      if (!res.ok) {
        vendorSelect.innerHTML = '<option value="">Failed to load vendors</option>';
        return showToast(res.error || 'Failed to load vendors', 'error');
      }
      vendorSelect.innerHTML = '<option value="">-- Select vendor --</option>';
      res.vendors.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        vendorSelect.appendChild(opt);
      });
    })
    .catch(err => {
      vendorSelect.innerHTML = '<option value="">Failed to load vendors</option>';
      showToast('Network error: ' + err, 'error');
    });
}
loadVendors();

/* ============ Barcode lookup (fully automatic after scan) ============ */
function lookupBarcode(barcode) {
  showToast('Looking up item...', 'success');
  fetch(APPS_SCRIPT_URL + '?action=lookupBarcode&barcode=' + encodeURIComponent(barcode))
    .then(r => r.json())
    .then(res => {
      if (!res.ok) return showToast(res.error || 'Lookup failed', 'error');
      document.getElementById('itemName').value = res.itemName || '';
      document.getElementById('category').value = res.category || '';
      document.getElementById('unit').value = res.unit || '';

      const preview = document.getElementById('itemPreview');
      const badge = document.getElementById('sourceBadge');
      preview.style.display = 'block';
      document.getElementById('previewName').textContent = res.itemName || '(no name found — enter manually)';
      document.getElementById('previewMeta').textContent = [res.category, res.unit].filter(Boolean).join(' • ');

      badge.textContent = 'Source: ' + res.source;
      badge.className = 'badge source-badge ' + (
        res.source === 'Master' ? 'bg-success' :
        res.source === 'Global API' ? 'bg-info text-dark' : 'bg-warning text-dark'
      );

      if (res.source === 'Manual') {
        showToast('Item not found in Master or online — please fill in manually', 'error');
      } else {
        showToast('Item auto-filled from ' + res.source + '!');
      }
    })
    .catch(err => showToast('Network error: ' + err, 'error'));
}

/* ============ Conditional payment mode (radio-like checkboxes) ============ */
const paymentStatusEl = document.getElementById('paymentStatus');
const paymentModeWrap = document.getElementById('paymentModeWrap');
const paymentModeOptions = document.getElementById('paymentModeOptions');

paymentStatusEl.addEventListener('change', () => {
  const status = paymentStatusEl.value;
  paymentModeOptions.innerHTML = '';
  if (status === 'Payment Done') {
    renderPaymentOptions(['Cash', 'UPI', 'Cheque']);
  } else if (status === 'Payment Pending') {
    renderPaymentOptions(['Credit', 'Cheque']);
  } else {
    paymentModeWrap.style.display = 'none';
  }
});

function renderPaymentOptions(options) {
  paymentModeWrap.style.display = 'block';
  options.forEach((opt) => {
    const id = 'pm_' + opt;
    const wrap = document.createElement('div');
    wrap.className = 'form-check';
    wrap.innerHTML = `
      <input class="form-check-input payment-mode-cb" type="checkbox" value="${opt}" id="${id}">
      <label class="form-check-label" for="${id}">${opt}</label>`;
    paymentModeOptions.appendChild(wrap);
  });
  paymentModeOptions.querySelectorAll('.payment-mode-cb').forEach(cb => {
    cb.addEventListener('change', function() {
      if (this.checked) {
        paymentModeOptions.querySelectorAll('.payment-mode-cb').forEach(other => {
          if (other !== this) other.checked = false;
        });
      }
    });
  });
}

function getSelectedPaymentMode() {
  const checked = paymentModeOptions.querySelector('.payment-mode-cb:checked');
  return checked ? checked.value : '';
}

/* ============ File -> base64 ============ */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve('');
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============ Submit ============ */
document.getElementById('inwardForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const submitBtn = document.getElementById('submitBtn');

  const vendorName = document.getElementById('vendorName').value;
  if (!vendorName) return showToast('Please select a vendor', 'error');

  const paymentStatus = paymentStatusEl.value;
  const paymentMode = getSelectedPaymentMode();
  if (!paymentMode) return showToast('Please select a payment mode', 'error');

  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving...';

  try {
    const fileInput = document.getElementById('billFile');
    const billFileData = await fileToBase64(fileInput.files[0]);

    const barcode = document.getElementById('barcode').value.trim();
    const sourceBadgeText = document.getElementById('sourceBadge').textContent.replace('Source: ', '') || 'Manual';

    const payload = {
      action: 'submitInward',
      branch: branch,
      vendorName: vendorName,
      barcode: barcode,
      itemName: document.getElementById('itemName').value.trim(),
      itemSource: sourceBadgeText,
      quantity: document.getElementById('quantity').value,
      billDate: document.getElementById('billDate').value,
      paymentStatus: paymentStatus,
      paymentMode: paymentMode,
      billFileData: billFileData
    };

    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (data.ok) {
      showToast('Entry saved successfully!');
      document.getElementById('inwardForm').reset();
      paymentModeWrap.style.display = 'none';
      document.getElementById('itemPreview').style.display = 'none';
      document.getElementById('vendorName').selectedIndex = 0;
    } else {
      showToast(data.error || 'Save failed', 'error');
    }
  } catch (err) {
    showToast('Error: ' + err.message, 'error');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Save Entry';
  }
});
</script>
</body>
</html>
